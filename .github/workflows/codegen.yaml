name: Codegen check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codegen-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install dependencies
        run: |
          install.packages(c("jsonlite", "Rcpp"))
        shell: Rscript {0}

      - name: Run code generator
        run: Rscript data-raw/generate.R

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated files are out of date. Run 'Rscript data-raw/generate.R' and commit the results."
            git diff --stat
            git diff
            exit 1
          fi
          echo "Generated files are up to date."
