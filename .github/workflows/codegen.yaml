name: Codegen check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codegen-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Install dependencies
        run: |
          # roxygen2 must match RoxygenNote in DESCRIPTION; newer versions
          # rewrite every Rd file and would fail the drift check below
          install.packages(c("jsonlite", "Rcpp", "remotes"))
          remotes::install_version("roxygen2", "7.3.3", upgrade = "never")
        shell: Rscript {0}

      - name: Run code generator
        run: Rscript data-raw/generate.R

      - name: Run Rcpp compile attributes
        run: Rscript -e 'Rcpp::compileAttributes()'

      - name: Run roxygen2
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated files are out of date. Run 'Rscript data-raw/generate.R' and commit the results."
            git diff --stat
            git diff
            exit 1
          fi
          echo "Generated files are up to date."
