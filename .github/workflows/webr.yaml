name: webR build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'inst/wasm/**'
      - 'inst/raylib-6.0-minimal.tar.gz'
      - 'inst/raygui.h'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webr-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-common-dev libx11-dev \
            libxrandr-dev libxi-dev xorg-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcursor-dev libharfbuzz-dev libfribidi-dev

      - name: Install R dependencies
        run: |
          install.packages(c("Rcpp", "rlang"))
        shell: Rscript {0}

      - name: Install raylibr (native, for R serialized files)
        run: R CMD INSTALL .

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.57

      - name: Build WASM package
        run: bash inst/wasm/build-webr.sh

      - name: Deploy WASM repo to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: pkgdown/assets/wasm/repo
          target-folder: wasm/repo
