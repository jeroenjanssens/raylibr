name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dri \
            xvfb

      - name: Install Mesa software renderer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pal1000/mesa-dist-win: pre-built Mesa 3D for Windows (llvmpipe, GL 4.5+)
          $tag = "26.2.4"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$tag/mesa3d-$tag-release-msvc.7z"
          Write-Host "Downloading Mesa $tag ..."
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\mesa.7z"
          Write-Host "Extracting ..."
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\mesa.7z" -o"$env:TEMP\mesa" -y | Out-Null
          # Place Mesa DLLs in R's bin directory (LoadLibrary searches there before System32)
          $rbin = & Rscript.exe --no-save -e "cat(R.home('bin'))"
          Write-Host "R bin dir: $rbin"
          # Copy all x64 DLLs so all transitive deps (e.g. LLVM pieces) are present.
          # opengl32.dll  = Mesa WGL loader (thin wrapper since Mesa 21.3.0)
          # libgallium_wgl.dll = Gallium megadriver containing llvmpipe/softpipe
          Get-ChildItem "$env:TEMP\mesa\x64\*.dll" | Copy-Item -Destination "$rbin\" -Force
          # Confirm key DLLs are in place
          Get-ChildItem "$rbin\opengl32.dll", "$rbin\libgallium_wgl.dll" | Select-Object Name, Length
          # Tell Mesa to use the pure-software llvmpipe driver
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RAYLIBR_GL=true"         | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "RAYLIBR_GL=true" >> $GITHUB_ENV

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
