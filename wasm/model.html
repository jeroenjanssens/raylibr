<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>R & Raylib: 3D Model</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
  #fs-btn { position: fixed; bottom: 8px; right: 8px; z-index: 10; background: rgba(128,128,128,0.4); border: none; color: #fff; font-size: 22px; width: 36px; height: 36px; cursor: pointer; border-radius: 6px; line-height: 36px; text-align: center; }
  #fs-btn:hover { background: rgba(128,128,128,0.7); }
  :fullscreen canvas { width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="450" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>
<button id="fs-btn" title="Fullscreen">&#x26F6;</button>

<script type="module">
document.getElementById('fs-btn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
import { initRaylibr } from './raylibr-host.js';

const { webR } = await initRaylibr({
  canvas: document.getElementById('canvas'),
  loadingEl: document.getElementById('loading'),
  input: {
    keyMap: { ArrowLeft: 263, ArrowRight: 262 },
    keydownMap: { ArrowLeft: 16, ArrowRight: 32 },
  },
  focusOnFirstFrame: true,
}).catch(e => { document.getElementById('loading').textContent = 'Error: ' + e.message; throw e; });

await webR.evalR(`
library(raylibr)

base_path <- file.path(system.file(package = "raylibr"), "demo_resources", "model")

shader_files <- list.files(base_path, pattern = "*_web.fs", full.names = TRUE)
shader_files <- c("/none.fs", shader_files)
shader_names <- sub("^.*\\\\/([a-z0-9_]+?)_web\\\\.fs$", "\\\\1", shader_files)

screen_width <- 600
screen_height <- 450

init_window(screen_width, screen_height, "R & Raylib: 3D Model and Post-Processing Shaders")

obj_src <- file.path(base_path, "church.obj3d")
obj_tmp <- file.path(tempdir(), "church.obj")
file.copy(obj_src, obj_tmp, overwrite = TRUE)
church_model <- load_model(obj_tmp)
church_texture <- load_texture(file.path(base_path, "church_diffuse.png"))
set_model_texture(church_model, 0, material_map_index$albedo, church_texture)
church_position <- c(0, 0, 0)

shaders <- lapply(shader_files, function(x) { load_shader("", x) })
current_shader <- 1
target <- load_render_texture(screen_width, screen_height)

cam <- camera_3d(c(2, 3, 2), c(0, 1, 0), fovy = 70)
set_target_fps(60)

while (!window_should_close()) {
  update_camera(cam, camera_mode$orbital)

  if (is_key_pressed(key$right)) current_shader <- current_shader + 1
  if (is_key_pressed(key$left)) current_shader <- current_shader - 1
  current_shader <- ((current_shader - 1) %% length(shaders)) + 1

  begin_texture_mode(target)
  clear_background(color(245, 245, 245))
  begin_mode_3d(cam)
  draw_model(church_model, church_position, 0.1, "white")
  draw_grid(10, 1)
  end_mode_3d()
  end_texture_mode()

  begin_drawing()
  clear_background(color(245, 245, 245))
  begin_shader_mode(shaders[[current_shader]])
  draw_texture_rec(target$texture,
                   rectangle(0, 0, target$texture$width, -target$texture$height),
                   c(0,0), "white")
  end_shader_mode()
  draw_rectangle(0, 0, screen_width, 50, fade("white", 0.7))
  draw_text(paste0("shader ", current_shader, "/", length(shader_names), ": ",
                   shader_names[current_shader]),
            15, 15, 20, "black")
  end_drawing()
}

lapply(shaders, unload_shader)
unload_texture(church_texture)
unload_model(church_model)
unload_render_texture(target)
close_window()
`);
</script>
</body>
</html>
