<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>R & Raylib: Bouncing Balls</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
import { initRaylibr } from './raylibr-host.js';

const { webR } = await initRaylibr({
  canvas: document.getElementById('canvas'),
  loadingEl: document.getElementById('loading'),
}).catch(e => { document.getElementById('loading').textContent = 'Error: ' + e.message; throw e; });

await webR.evalR(`
library(raylibr)

width <- 600
height <- 400
n <- 1000

sizes <- runif(n, 2, 20)
xs <- runif(n, sizes, width - sizes)
ys <- runif(n, sizes, height - sizes)
dxs <- rnorm(n)
dys <- rnorm(n)
cs <- sample(colors(), n, replace = TRUE)
cs <- lapply(cs, fade, 0.7)

set_target_fps(100)
init_window(width, height, "R & Raylib: Bouncing Balls")

while (!window_should_close()) {
  xs <- xs + (dxs / 2)
  ys <- ys + (dys / 2)
  oobx <- (xs >= (width - sizes)) | (xs <= sizes)
  ooby <- (ys >= (height - sizes)) | (ys <= sizes)
  dxs[oobx] <- dxs[oobx] * -1
  dys[ooby] <- dys[ooby] * -1
  xs <- xs + (dxs / 2)
  ys <- ys + (dys / 2)

  begin_drawing()
  clear_background("white")
  draw_circle(xs, ys, sizes, cs)
  draw_text(paste0("fps: ", get_fps()), 20, 20, 20, "blue")
  end_drawing()
}

close_window()
`);
</script>
</body>
</html>
