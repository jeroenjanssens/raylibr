<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>R & Raylib: Hello, World!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
import { initRaylibr } from './raylibr-host.js';

const { webR } = await initRaylibr({
  canvas: document.getElementById('canvas'),
  loadingEl: document.getElementById('loading'),
}).catch(e => { document.getElementById('loading').textContent = 'Error: ' + e.message; throw e; });

await webR.evalR(`
library(raylibr)

init_window(600, 400, "R & Raylib: Hello, World!")

while (!window_should_close()) {
  alpha <- abs(sin(get_time()))
  begin_drawing()
  clear_background("black")
  draw_circle(300, 200, seq(150, 10, by = -10), c("red", "white"))
  draw_text(c("hello,", "world!"), 225, c(120, 220), 64, fade("black", alpha))
  draw_fps(10, 10)
  end_drawing()
}

close_window()
`);
</script>
</body>
</html>
