<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>raylibr: Beatbox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="600" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');
const loading = document.getElementById('loading');

const _OrigWorker = Worker;
let inputSAB = null;
let webRWorker = null;
globalThis.Worker = class extends _OrigWorker {
  constructor(...args) {
    super(...args);
    webRWorker = this;
    this.addEventListener('message', (e) => {
      if (e.data && e.data.type === '__raylibr_sab') {
        inputSAB = new Int32Array(e.data.sab);
      } else if (e.data && e.data.type === '__raylibr_audio') {
        audioProxy.handle(e.data);
      } else if (e.data && e.data.type === '__raylibr_cursor') {
        canvas.style.cursor = e.data.cursor;
      } else if (e.data && e.data.type === '__raylibr_frame') {
        const src = new Uint8ClampedArray(e.data.px);
        const w = e.data.w, h = e.data.h, stride = w * 4;
        const dst = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
          dst.set(src.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
        }
        ctx2d.putImageData(new ImageData(dst, w, h), 0, 0);
        if (loading.style.display !== 'none') {
          loading.style.display = 'none';
          canvas.focus();
        }
      }
    });
  }
};

import { audioProxy } from './raylibr-audio.js';
import { WebR } from 'https://webr.r-wasm.org/v0.6.0/webr.mjs';

const KEYDOWN_MAP = { 'ShiftLeft': 8192, 'ShiftRight': 16384 };

const KEY_MAP = {
  ' ': 32,
};

canvas.addEventListener('keydown', (e) => {
  if (!inputSAB) return;
  const bit = KEYDOWN_MAP[e.code];
  if (bit !== undefined) Atomics.or(inputSAB, 6, bit);
  const raylibKey = KEY_MAP[e.key] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0);
  if (raylibKey) {
    Atomics.store(inputSAB, 3, raylibKey);
    e.preventDefault();
  }
});
canvas.addEventListener('keyup', (e) => {
  if (!inputSAB) return;
  const bit = KEYDOWN_MAP[e.code];
  if (bit !== undefined) Atomics.and(inputSAB, 6, ~bit);
});
canvas.addEventListener('blur', () => { if (inputSAB) Atomics.store(inputSAB, 6, 0); });

canvas.addEventListener("click", () => { audioProxy.unlock(); if (webRWorker) webRWorker.postMessage({type: "__raylibr_audio_unlock"}); });

async function main() {
  const webR = new WebR();
  await webR.init();
  loading.textContent = 'Installing packages...';
  await webR.installPackages(['Rcpp'], { repos: ['https://repo.r-wasm.org'], quiet: true });
  const localRepo = new URL('repo', window.location.href).href;
  await webR.installPackages(['raylibr'], { repos: [localRepo], quiet: true });
  loading.textContent = 'Starting demo...';
  await webR.evalR('library(raylibr)');
  await webR.evalR(`
    files <- list.files(file.path(system.file(package = "raylibr"), "demo_resources", "beatbox-samples"), full.names = TRUE)
    ids <- sub("^.*\\\\/([a-z0-9]+)\\\\.wav$", "\\\\1", files)
    texts <- c()
    lives <- c()
    max_life <- 30

    init_audio_device()
    sounds <- lapply(files, load_sound)

    s <- 600
    init_window(s, s, "R & Raylib: Beatbox like Jeroen")
    set_target_fps(30)

    background <- load_texture(file.path(system.file(package = "raylibr"), "demo_resources", "beatbox.png"))

    while (!window_should_close()) {
      k <- get_key_pressed()
      if (k == key$space) {
        lapply(sounds, stop_sound)
      } else if ((k >= key$a) && (k <= key$z)) {
        keyname <- tolower(rawToChar(as.raw(k)))
        ix <- k - key$a + 1
        if (is_key_down(key$left_shift) || is_key_down(key$right_shift)) {
          ix <- ix + 26
          keyname <- toupper(keyname)
        }
        if (ix <= length(sounds)) {
          texts <- c(texts, ids[ix])
          lives <- c(lives, max_life)
          play_sound(sounds[[ix]])
        }
      }

      lives <- lives - 1
      keep <- lives > 0
      lives <- lives[keep]
      texts <- texts[keep]

      begin_drawing()
      clear_background("black")
      draw_texture(background, 0, 0, "white")

      for (t in seq_along(texts)) {
        draw_text(texts[t], 320 + 2*(max_life - lives[t]), 290 + 1.5*(max_life - lives[t]), 20 + (max_life - lives[t]), fade("white", lives[t] / max_life))
      }

      end_drawing()
    }

    close_window()
    close_audio_device()
  `);
}

main().catch(e => { loading.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
