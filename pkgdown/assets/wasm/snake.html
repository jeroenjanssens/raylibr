<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>raylibr: Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="480" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');
const loading = document.getElementById('loading');

const _OrigWorker = Worker;
let inputSAB = null;
let webRWorker = null;
globalThis.Worker = class extends _OrigWorker {
  constructor(...args) {
    super(...args);
    webRWorker = this;
    this.addEventListener('message', (e) => {
      if (e.data && e.data.type === '__raylibr_sab') {
        inputSAB = new Int32Array(e.data.sab);
      } else if (e.data && e.data.type === '__raylibr_cursor') {
        canvas.style.cursor = e.data.cursor;
      } else if (e.data && e.data.type === '__raylibr_frame') {
        const src = new Uint8ClampedArray(e.data.px);
        const w = e.data.w, h = e.data.h, stride = w * 4;
        const dst = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
          dst.set(src.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
        }
        ctx2d.putImageData(new ImageData(dst, w, h), 0, 0);
        if (loading.style.display !== 'none') {
          loading.style.display = 'none';
          canvas.focus();
        }
      }
    });
  }
};

import { WebR } from 'https://webr.r-wasm.org/v0.6.0/webr.mjs';

const KEY_MAP = {
  'ArrowUp': 265,
  'ArrowDown': 264,
  'ArrowLeft': 263,
  'ArrowRight': 262,
};

canvas.addEventListener('keydown', (e) => {
  if (!inputSAB) return;
  const raylibKey = KEY_MAP[e.key];
  if (raylibKey) {
    Atomics.store(inputSAB, 3, raylibKey);
    e.preventDefault();
  }
});

canvas.addEventListener("click", () => { if (webRWorker) webRWorker.postMessage({type: "__raylibr_audio_unlock"}); });

async function main() {
  const webR = new WebR();
  await webR.init();

  loading.textContent = 'Installing packages...';
  await webR.installPackages(['Rcpp'], { repos: ['https://repo.r-wasm.org'], quiet: true });
  const localRepo = new URL('repo', window.location.href).href;
  await webR.installPackages(['raylibr'], { repos: [localRepo], quiet: true });

  loading.textContent = 'Starting demo...';
  await webR.evalR('library(raylibr)');

  await webR.evalR(`
    width <- 20
    height <- 16
    scale <- 30

    init_window(width * scale, height * scale, title = "R & Raylib: Snake")

    snake <- list(as.integer(c(width, height) / 2))

    walls <- c(lapply(1:width,  function(x) c(x, 1)),
               lapply(1:width,  function(x) c(x, height)),
               lapply(1:height, function(x) c(1, x)),
               lapply(1:height, function(x) c(width, x)))

    \`%on%\` <- function(needle, haystack) {
      for (candidate in haystack) {
        if (all(candidate == needle)) return(TRUE)
      }
      FALSE
    }

    random_empty_cell <- function(w, h, nonempty) {
      pos <- c(sample(w, 1), sample(h, 1))
      while(pos %on% nonempty) pos <- c(sample(w, 1), sample(h, 1))
      pos
    }

    food <- random_empty_cell(width, height, c(walls, snake))

    directions <- list(up = c(0, -1),
                       down = c(0, 1),
                       left = c(-1, 0),
                       right = c(1, 0))

    direction <- c(0, 0)

    set_target_fps(10)

    while(!window_should_close()) {
      key_code <- get_key_pressed()
      key_name <- ifelse(key_code, names(key)[[match(key_code, key)]], NA)

      if (key_name %in% names(directions)) {
        new_direction <- directions[[key_name]]
        if (sum(abs(direction + new_direction)) > 0) {
          direction <- new_direction
        }
      }

      snake <- unique(snake)
      new_head <- snake[[1]] + direction

      if (new_head %on% c(walls, snake[-1])) {
        direction <- c(0, 0)
        snake <- list(as.integer(c(width, height) / 2))
        food <- random_empty_cell(width, height, c(walls, snake))
      } else if (new_head %on% list(food)) {
        snake <- c(list(new_head), snake)
        food <- random_empty_cell(width, height, c(walls, snake))
      } else {
        snake <- c(list(new_head), head(snake, -1))
      }

      begin_drawing()
      clear_background("black")
      lapply(walls, function(x) { draw_rectangle_v((x - 1) * scale + 1, c(scale, scale) - 2, "sienna") } )
      lapply(snake, function(x) { draw_rectangle_v((x - 1) * scale + 1, c(scale, scale) - 2, "olivedrab") })
      draw_circle_v(food * scale - scale / 2, scale / 2 - 4, "red")
      draw_text(paste0("SCORE: ", length(snake) - 1), 4, 2, scale - 2, "white")
      end_drawing()
    }

    close_window()
  `);
}

main().catch(e => { loading.textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
