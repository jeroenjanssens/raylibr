<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>raylibr: Julia Sets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');
const loading = document.getElementById('loading');

const _OrigWorker = Worker;
let inputSAB = null;
let webRWorker = null;
globalThis.Worker = class extends _OrigWorker {
  constructor(...args) {
    super(...args);
    webRWorker = this;
    this.addEventListener('message', (e) => {
      if (e.data && e.data.type === '__raylibr_sab') {
        inputSAB = new Int32Array(e.data.sab);
      } else if (e.data && e.data.type === '__raylibr_cursor') {
        canvas.style.cursor = e.data.cursor;
      } else if (e.data && e.data.type === '__raylibr_frame') {
        const src = new Uint8ClampedArray(e.data.px);
        const w = e.data.w, h = e.data.h, stride = w * 4;
        const dst = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
          dst.set(src.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
        }
        ctx2d.putImageData(new ImageData(dst, w, h), 0, 0);
        if (loading.style.display !== 'none') {
          loading.style.display = 'none';
          canvas.focus();
        }
      }
    });
  }
};

import { WebR } from 'https://webr.r-wasm.org/v0.6.0/webr.mjs';

const KEY_MAP = {
  'ArrowLeft': 263, 'ArrowRight': 262, 'ArrowUp': 265, 'ArrowDown': 264,
  'Escape': 256, 'Enter': 257, ' ': 32,
  '1': 49, '2': 50, '3': 51, '4': 52, '5': 53, '6': 54,
};

canvas.addEventListener('mousemove', (e) => {
  if (!inputSAB) return;
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  Atomics.store(inputSAB, 0, Math.round((e.clientX - rect.left) * sx));
  Atomics.store(inputSAB, 1, Math.round((e.clientY - rect.top) * sy));
  Atomics.store(inputSAB, 2, 1);
});
canvas.addEventListener('mouseenter', () => { if (inputSAB) Atomics.store(inputSAB, 2, 1); });
canvas.addEventListener('mouseleave', () => {
  if (!inputSAB) return;
  Atomics.store(inputSAB, 2, 0);
  Atomics.store(inputSAB, 4, 0);
  Atomics.store(inputSAB, 5, 0);
});
canvas.addEventListener('mousedown', (e) => {
  if (!inputSAB) return;
  if (e.button === 0) Atomics.store(inputSAB, 4, 1);
  if (e.button === 2) Atomics.store(inputSAB, 5, 1);
  canvas.focus();
  e.preventDefault();
});
canvas.addEventListener('mouseup', (e) => {
  if (!inputSAB) return;
  if (e.button === 0) Atomics.store(inputSAB, 4, 0);
  if (e.button === 2) Atomics.store(inputSAB, 5, 0);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('keydown', (e) => {
  if (!inputSAB) return;
  const raylibKey = KEY_MAP[e.key] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0);
  if (raylibKey) {
    Atomics.store(inputSAB, 3, raylibKey);
    e.preventDefault();
  }
});

canvas.addEventListener("click", () => { if (webRWorker) webRWorker.postMessage({type: "__raylibr_audio_unlock"}); });

async function main() {
  const webR = new WebR();
  await webR.init();
  loading.textContent = 'Installing packages...';
  await webR.installPackages(['Rcpp'], { repos: ['https://repo.r-wasm.org'], quiet: true });
  const localRepo = new URL('repo', window.location.href).href;
  await webR.installPackages(['raylibr'], { repos: [localRepo], quiet: true });
  loading.textContent = 'Starting demo...';
  await webR.evalR('library(raylibr)');
  await webR.evalR(`
    points_of_interest <- list(
      c(-0.348827, 0.607167),
      c(-0.786268, 0.169728),
      c(-0.8, 0.156),
      c(0.285, 0.0),
      c(-0.835, -0.2321),
      c(-0.70176, -0.3842)
    )

    init_window(600, 400, "R & Raylib: Julia Sets")

    s <- load_shader("", file.path(system.file(package = "raylibr"), "demo_resources", "julia_set.fs"))

    target <- load_render_texture(get_screen_width(), get_screen_height())
    current_c <- points_of_interest[[1]]

    zoom <- 1
    offset <- c(get_screen_width(), get_screen_height()) / -2
    offset_speed <- c(0, 0)

    loc_c <- get_shader_location(s, "c")
    loc_zoom <- get_shader_location(s, "zoom")
    loc_offet <- get_shader_location(s, "offset")

    set_shader_value(s, get_shader_location(s, "screenDims"),
                     c(get_screen_width(), get_screen_height()))

    set_shader_value(s, loc_c, current_c)
    set_shader_value(s, loc_zoom, zoom)
    set_shader_value(s, loc_offet, offset)

    increment_speed <- 0
    show_controls <- TRUE
    pause <- FALSE

    set_target_fps(60)

    while (!window_should_close()) {
      k <- get_key_pressed()

      if (k >= key$one && k <= key$six) {
        current_c <- points_of_interest[[k - key$one + 1]]
        zoom <- 1
        offset <- c(get_screen_width(), get_screen_height()) / -2
        offset_speed <- c(0, 0)
        set_shader_value(s, loc_c, current_c)
      }

      if (k == key$space) pause <- !pause
      if (k == key$enter) show_controls <- !show_controls

      if (!pause) {
        if (k == key$right) increment_speed <- increment_speed + 1
        if (k == key$left) increment_speed <- increment_speed - 1

        if (is_mouse_button_down(mouse_button$left) ||
            is_mouse_button_down(mouse_button$right)) {

          if (is_mouse_button_down(mouse_button$left)) zoom <- zoom * 1.003
          if (is_mouse_button_down(mouse_button$right)) zoom <- zoom / 1.003

          mouse_pos <- get_mouse_position()
          offset_speed <- mouse_pos - (c(get_screen_width(), get_screen_height()) / 2)
          offset <- offset + get_frame_time() * offset_speed
        } else {
          offset_speed <- c(0, 0)
        }

        set_shader_value(s, loc_zoom, zoom)
        set_shader_value(s, loc_offet, offset)

        current_c <- current_c + get_frame_time() * increment_speed * 0.0005
        set_shader_value(s, loc_c, current_c)
      }

      begin_texture_mode(target)
      clear_background("black")
      draw_rectangle(0, 0, get_screen_width(), get_screen_height(), "black")
      end_texture_mode()

      begin_drawing()
      clear_background("black")
      begin_shader_mode(s)
      draw_texture_ex(target$texture, c(0, 0), 0, 1, "white")
      end_shader_mode()

      if (show_controls) {
        draw_text("Press mouse buttons right/left to zoom in/out and move", 10, 15, 12, "white");
        draw_text("Press Enter to toggle these controls", 10, 30, 12, "white");
        draw_text("Press [1 - 6] to change point of interest", 10, 45, 12, "white");
        draw_text("Press Left or Right to change speed", 10, 60, 12, "white");
        draw_text("Press Space to pause movement animation", 10, 75, 12, "white");
      }

      end_drawing()

    }

    unload_shader(s)
    unload_render_texture(target)
    close_window()
  `);
}

main().catch(e => { loading.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
