<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>raylibr: Mouse Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="600"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');
const loading = document.getElementById('loading');

const _OrigWorker = Worker;
let inputSAB = null;
let webRWorker = null;
globalThis.Worker = class extends _OrigWorker {
  constructor(...args) {
    super(...args);
    webRWorker = this;
    this.addEventListener('message', (e) => {
      if (e.data && e.data.type === '__raylibr_sab') {
        inputSAB = new Int32Array(e.data.sab);
      } else if (e.data && e.data.type === '__raylibr_cursor') {
        canvas.style.cursor = e.data.cursor;
      } else if (e.data && e.data.type === '__raylibr_frame') {
        const src = new Uint8ClampedArray(e.data.px);
        const w = e.data.w, h = e.data.h, stride = w * 4;
        const dst = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
          dst.set(src.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
        }
        ctx2d.putImageData(new ImageData(dst, w, h), 0, 0);
        if (loading.style.display !== 'none') loading.style.display = 'none';
      }
    });
  }
};

import { WebR } from 'https://webr.r-wasm.org/v0.6.0/webr.mjs';

canvas.addEventListener('mousemove', (e) => {
  if (!inputSAB) return;
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  Atomics.store(inputSAB, 0, Math.round((e.clientX - rect.left) * sx));
  Atomics.store(inputSAB, 1, Math.round((e.clientY - rect.top) * sy));
  Atomics.store(inputSAB, 2, 1);
});

canvas.addEventListener('mouseenter', () => {
  if (inputSAB) Atomics.store(inputSAB, 2, 1);
});

canvas.addEventListener('mouseleave', () => {
  if (inputSAB) Atomics.store(inputSAB, 2, 0);
});

canvas.addEventListener("click", () => { if (webRWorker) webRWorker.postMessage({type: "__raylibr_audio_unlock"}); });

async function main() {
  const webR = new WebR();
  await webR.init();

  loading.textContent = 'Installing packages...';
  await webR.installPackages(['Rcpp'], { repos: ['https://repo.r-wasm.org'], quiet: true });
  const localRepo = new URL('repo', window.location.href).href;
  await webR.installPackages(['raylibr'], { repos: [localRepo], quiet: true });

  loading.textContent = 'Starting demo...';
  await webR.evalR('library(raylibr)');

  await webR.evalR(`
    width <- 600
    height <- 600

    init_window(width, height, "R & Raylib: Mouse Test")

    n <- 31
    xs <- tail(head(seq(0, width, length.out = n), -4), -4)
    ys <- tail(head(seq(0, height, length.out = n), -4), -4)

    l <- 100

    while (!window_should_close()) {

      mp <- get_mouse_position()

      begin_drawing()
      clear_background("black")

      if (is_cursor_on_screen()) {
        set_mouse_cursor(mouse_cursor$crosshair)
      } else {
        set_mouse_cursor(mouse_cursor$default)
      }

      for (x in xs) {
        for (y in ys) {
          from <- c(x, y)
          d <- vector2_distance(mp, from)
          m <- max(l - d, 0)
          to <- vector2_move_towards(from, mp, -m/4)
          dd <- vector2_distance(mp, to)
          if (dd < l/2) {
            draw_line_v(to, mp, "white")
          }
          draw_circle_v(to, 3, color_from_hsv(l - m, 0.9, 0.9))
        }
      }

      draw_fps(10, 10)
      end_drawing()
    }

    set_mouse_cursor(mouse_cursor$default)
    close_window()
  `);
}

main().catch(e => { loading.textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
