<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>raylibr: Stroop Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
const canvas = document.getElementById('canvas');
const ctx2d = canvas.getContext('2d');
const loading = document.getElementById('loading');

const _OrigWorker = Worker;
let inputSAB = null;
let webRWorker = null;
globalThis.Worker = class extends _OrigWorker {
  constructor(...args) {
    super(...args);
    webRWorker = this;
    this.addEventListener('message', (e) => {
      if (e.data && e.data.type === '__raylibr_sab') {
        inputSAB = new Int32Array(e.data.sab);
      } else if (e.data && e.data.type === '__raylibr_frame') {
        const src = new Uint8ClampedArray(e.data.px);
        const w = e.data.w, h = e.data.h, stride = w * 4;
        const dst = new Uint8ClampedArray(src.length);
        for (let y = 0; y < h; y++) {
          dst.set(src.subarray((h - 1 - y) * stride, (h - y) * stride), y * stride);
        }
        ctx2d.putImageData(new ImageData(dst, w, h), 0, 0);
        if (loading.style.display !== 'none') {
          loading.style.display = 'none';
          canvas.focus();
        }
      }
    });
  }
};

import { WebR } from 'https://webr.r-wasm.org/v0.6.0/webr.mjs';

const KEY_MAP = {
  'ArrowUp': 265, 'ArrowDown': 264, 'ArrowLeft': 263, 'ArrowRight': 262,
  'Escape': 256, 'Enter': 257, ' ': 32,
};

canvas.addEventListener('keydown', (e) => {
  if (!inputSAB) return;
  const raylibKey = KEY_MAP[e.key] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0);
  if (raylibKey) {
    Atomics.store(inputSAB, 3, raylibKey);
    e.preventDefault();
  }
});

canvas.addEventListener("click", () => { if (webRWorker) webRWorker.postMessage({type: "__raylibr_audio_unlock"}); });

async function main() {
  const webR = new WebR();
  await webR.init();
  loading.textContent = 'Installing packages...';
  await webR.installPackages(['Rcpp'], { repos: ['https://repo.r-wasm.org'], quiet: true });
  const localRepo = new URL('repo', window.location.href).href;
  await webR.installPackages(['raylibr'], { repos: [localRepo], quiet: true });
  loading.textContent = 'Starting demo...';
  await webR.evalR('library(raylibr)');
  await webR.evalR(`
    candidates <- c("red", "green", "blue", "orange", "black", "purple", "hotpink")
    word <- ""
    color <- ""

    screen_size <- c(600, 400)
    init_window(screen_size[1], screen_size[2], "R & Raylib: Stroop Test")

    font_size <- 200
    font <- load_font_ex(file.path(system.file(package = "raylibr"), "demo_resources", "source-sans-pro-v14-latin-regular.ttf"), font_size)

    while (!window_should_close()) {
      screen_size <- c(get_screen_width(), get_screen_height())

      if (get_key_pressed()) {
        prev_word <- word
        prev_color <- color
        while ((word == color) || (word == prev_word) || (color == prev_color)) {
          word <- sample(candidates, 1)
          color <- sample(candidates, 1)
        }
        text_size <- measure_text_ex(font, word, font_size, 0)
        text_pos <- screen_size / 2 - text_size / 2 - c(0, 20)
      }

      begin_drawing()
      clear_background("white")
      if (word != "") {
        draw_text_ex(font, word, text_pos, font_size, 0, color)
      } else {
        draw_text("Click here, then press any key", 120, 185, 20, "gray")
      }
      end_drawing()
    }

    close_window()
  `);
}

main().catch(e => { loading.textContent = 'Error: ' + e.message; console.error(e); });
</script>
</body>
</html>
