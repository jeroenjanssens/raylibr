<!DOCTYPE html>
<html lang="en">
<head>
<script src="coi-serviceworker.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>R & Raylib: Stroop Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; image-rendering: pixelated; }
  #loading { position: absolute; color: #888; font-family: monospace; font-size: 14px; }
</style>
</head>
<body>
<canvas id="canvas" width="600" height="400" tabindex="0"></canvas>
<div id="loading">Loading raylibr...</div>

<script type="module">
import { initRaylibr } from './raylibr-host.js';

const { webR } = await initRaylibr({
  canvas: document.getElementById('canvas'),
  loadingEl: document.getElementById('loading'),
  input: {
    keyMap: {},
  },
  focusOnFirstFrame: true,
}).catch(e => { document.getElementById('loading').textContent = 'Error: ' + e.message; throw e; });

await webR.evalR(`
library(raylibr)

candidates <- c("red", "green", "blue", "orange", "black", "purple", "hotpink")
word <- ""
color <- ""

screen_size <- c(600, 400)
init_window(screen_size[1], screen_size[2], "R & Raylib: Stroop Test")

font_size <- 200
font <- load_font_ex(file.path(system.file(package = "raylibr"), "demo_resources", "source-sans-pro-v14-latin-regular.ttf"), font_size)

while (!window_should_close()) {
  screen_size <- c(get_screen_width(), get_screen_height())

  if (get_key_pressed()) {
    prev_word <- word
    prev_color <- color
    while ((word == color) || (word == prev_word) || (color == prev_color)) {
      word <- sample(candidates, 1)
      color <- sample(candidates, 1)
    }
    text_size <- measure_text_ex(font, word, font_size, 0)
    text_pos <- screen_size / 2 - text_size / 2 - c(0, 20)
  }

  begin_drawing()
  clear_background("white")
  if (word != "") {
    draw_text_ex(font, word, text_pos, font_size, 0, color)
  }
  end_drawing()
}

close_window()
`);
</script>
</body>
</html>
